<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="navbar">
    <div class="logo">🛡 PhishGuard Report</div>
</div>

<div class="report">

    <h1>Threat Analysis Report</h1>

    <div class="url-box">
        <p>{{ url }}</p>
    </div>

    <div class="result-card {{ color }}">
        <h2>{{ result }}</h2>
        <h3>Confidence: {{ confidence }}%</h3>
    </div>

    <!-- GAUGE -->
    <div class="meter">
        <div class="fill" style="width: {{ confidence }}%;"></div>
    </div>

    <p>Threat Level: {{ confidence }}%</p>

    <!-- CHART -->
    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

    <!-- TERMINAL -->
    <div class="terminal" id="terminal"></div>

    <a href="/"><button>Scan Again</button></a>

    <button onclick="downloadReport()">Download Report</button>

</div>

<script>
/* CHART */
new Chart(document.getElementById("chart"), {
    type: "doughnut",
    data: {
        labels: ["Safe", "Threat"],
        datasets: [{
            data: [100 - {{ confidence }}, {{ confidence }}],
            backgroundColor: ["#00ff99", "#ff3b3b"]
        }]
    }
});

/* LIVE LOGS */
let logs = [
    "Analyzing URL...",
    "Extracting features...",
    "Checking domain...",
    "Running ML model...",
    "Generating result..."
];

let i = 0;
function showLogs(){
    if(i < logs.length){
        document.getElementById("terminal").innerHTML += "> " + logs[i] + "<br>";
        i++;
        setTimeout(showLogs, 500);
    }
}
showLogs();

/* DOWNLOAD */
function downloadReport(){
    let text = `PhishGuard Report\nURL: {{ url }}\nResult: {{ result }}\nConfidence: {{ confidence }}%`;
    let blob = new Blob([text], {type:"text/plain"});
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "report.txt";
    link.click();
}
</script>

</body>
</html>
