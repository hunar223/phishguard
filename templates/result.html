<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Report</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="bg"></div>

<nav class="navbar">
    <div class="logo">🛡 PhishGuard Report</div>
    <div class="nav-links">
        <span>Analysis Complete</span>
    </div>
</nav>

<section class="report">

    <h1>Threat Analysis Report</h1>

    <div class="box">
        <p><strong>Scanned URL</strong></p>
        <p>{{ url }}</p>
    </div>

    <div class="result {{ color }}">
        <h2>{{ result }}</h2>
        <h3>Model Confidence: {{ confidence }}%</h3>
        <h3>Threat Level: {{ threat }}%</h3>
    </div>

    <div class="meter">
        <div class="fill" style="width: {{ threat }}%;"></div>
    </div>

    <div class="status-box">
        {% if color == "red" %}
            <h3 class="danger">⚠ HIGH RISK DETECTED</h3>
        {% else %}
            <h3 class="safe">✔ SAFE WEBSITE</h3>
        {% endif %}
    </div>

    <div class="terminal" id="log"></div>

    <a href="/">
        <button>Scan Again</button>
    </a>

</section>

<script>
let logs = [
    "Initializing scan...",
    "Extracting URL features...",
    "Checking domain reputation...",
    "Running ML model...",
    "Generating threat score...",
    "Final result generated ✔"
];

let i = 0;

function runLogs() {
    if (i < logs.length) {
        document.getElementById("log").innerHTML += "> " + logs[i] + "<br>";
        i++;
        setTimeout(runLogs, 500);
    }
}

runLogs();
</script>

</body>
</html>
